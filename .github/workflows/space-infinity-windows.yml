name: Space Infinity Windows build
on:
  workflow_dispatch:
  push:
    branches: [codex/windows-build]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: native-vst3/build
          key: windows-juce807-v2-${{ hashFiles('native-vst3/**', 'scripts/**') }}
          restore-keys: windows-juce807-v2-
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and package
        run: .\scripts\package-windows.ps1
      - name: Verify factory bank, state and editor
        run: ctest --test-dir native-vst3/build -C Release --output-on-failure
      - name: Verify installer and VST3 archive
        run: .\scripts\verify-windows-release.ps1
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish-windows-release.ps1
      - name: Optional installer artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          retention-days: 7
          compression-level: 0
          name: Space-Infinity-Windows-x64
          path: release/*
          if-no-files-found: error
      - name: Optional preset auditions
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          retention-days: 3
          name: Space-Infinity-Preset-Audition
          path: native-vst3/build/audition
          if-no-files-found: error

      - name: Cache native build for subsequent updates
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: native-vst3/build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
