name: Space Infinity Windows build
on:
  workflow_dispatch:
    inputs:
      installer_zip_only:
        description: Package the already verified release installer into a ZIP
        type: boolean
        default: false
      release_version:
        description: Existing release version to repackage (blank uses the current native version)
        type: string
        default: ''
  push:
    branches: [codex/windows-build]
permissions:
  contents: write
jobs:
  package:
    if: ${{ !inputs.installer_zip_only }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: native-vst3/build
          key: windows-juce807-v2-${{ hashFiles('native-vst3/**', 'scripts/**') }}
          restore-keys: windows-juce807-v2-
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and package
        run: .\scripts\package-windows.ps1
      - name: Verify factory bank, state and editor
        run: ctest --test-dir native-vst3/build -C Release --output-on-failure
      - name: Verify preset-edit ZIP importer
        run: python scripts/tests/test_factory_edits.py
      - name: Verify installer and VST3 archive
        run: .\scripts\verify-windows-release.ps1
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish-windows-release.ps1
      - name: Optional installer artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          retention-days: 7
          compression-level: 0
          name: Space-Infinity-Windows-x64
          path: release/*
          if-no-files-found: error
      - name: Optional preset auditions
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        with:
          retention-days: 3
          name: Space-Infinity-Preset-Audition
          path: native-vst3/build/audition
          if-no-files-found: error

      - name: Cache native build for subsequent updates
        if: ${{ !cancelled() && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: native-vst3/build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

  installer-zip:
    if: ${{ inputs.installer_zip_only }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        env:
          REQUESTED_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          version = os.environ.get('REQUESTED_RELEASE_VERSION') or re.search(r'project\(SpaceInfinity VERSION ([0-9.]+)', Path('native-vst3/CMakeLists.txt').read_text()).group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid release version')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('RELEASE_VERSION=' + version + '\n')
          PYTHON
      - name: Download verified release assets
        run: gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Package and verify installer ZIP
        run: python3 scripts/package-installer-zip.py release "$RELEASE_VERSION"
      - name: Publish installer ZIP
        run: >-
          gh release upload "v$RELEASE_VERSION"
          "release/SPACE_INFINITY_${RELEASE_VERSION}_Windows_x64_Installer.zip"
          "release/SPACE_INFINITY_${RELEASE_VERSION}_Windows_x64_Installer.zip.sha256"
          --repo "$GITHUB_REPOSITORY" --clobber
